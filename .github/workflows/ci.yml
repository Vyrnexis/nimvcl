name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      SDL_VIDEO_DRIVER: offscreen
      SDL_RENDER_DRIVER: software
    steps:
      - name: Install toolchain and SDL3
        run: |
          pacman -Syu --noconfirm --needed git gcc nim nimble sdl3 sdl3_ttf sdl3_image noto-fonts
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: nimble install -d -y
      - name: Build examples
        run: for f in examples/*.nim; do nim c --outdir:build "$f"; done
      - name: Test
        run: if ls tests/t*.nim >/dev/null 2>&1; then nimble test; fi
