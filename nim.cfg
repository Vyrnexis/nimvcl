--path:"$config/src"

# macOS: the SDL binding dlopens "libSDL3.dylib" by bare name, which dyld does
# not find in Homebrew's prefix. Link SDL3, SDL3_ttf and SDL3_image at build
# time instead.
@if macosx:
  --dynlibOverride:SDL3
  --dynlibOverride:SDL3_ttf
  --dynlibOverride:SDL3_image
  --passL:"-L/opt/homebrew/lib -L/usr/local/lib -lSDL3 -lSDL3_ttf -lSDL3_image"
@end
